[theme]
# Force dark mode for all users
base = "dark"
primaryColor = "#3d7ab7"
backgroundColor = "#0a1628"
secondaryBackgroundColor = "#1a2744"
textColor = "#e0e6ed"
font = "sans serif"

[client]
# Cleaner production UI
showErrorDetails = false
toolbarMode = "minimal"

[server]
# Performance optimizations
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = false
